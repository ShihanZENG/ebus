name: EBUS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Check customer intent, payment gate and LIM sandbox
        working-directory: backend
        run: python -m pytest tests/test_intent_context.py tests/test_storefront_bridge.py tests/test_external_payment_idempotency.py tests/test_lim_five_pillars.py tests/test_erp.py::test_migration_seed_persistence -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build management frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
